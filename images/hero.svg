<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360" role="img" aria-label="Ilustração de estudantes chegando ao campus com prédios, livros e balões de conversa">
  <defs>
    <linearGradient id="cartao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="predio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fe0"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- cartão de fundo -->
  <rect x="20" y="30" width="400" height="300" rx="24" fill="url(#cartao)"/>

  <!-- sol (âmbar) -->
  <circle cx="360" cy="78" r="26" fill="#f59e0b"/>

  <!-- prédio da esquerda (branco) -->
  <rect x="68" y="150" width="92" height="130" rx="6" fill="#ffffff"/>
  <rect x="84" y="168" width="22" height="22" rx="4" fill="#06b6d4"/>
  <rect x="122" y="168" width="22" height="22" rx="4" fill="#06b6d4"/>
  <rect x="84" y="206" width="22" height="22" rx="4" fill="#06b6d4"/>
  <rect x="122" y="206" width="22" height="22" rx="4" fill="#06b6d4"/>
  <rect x="100" y="244" width="30" height="36" rx="4" fill="#f59e0b"/>
  <!-- bandeirinha -->
  <path d="M114 150 v-24 l18 8 -18 8" fill="#f59e0b"/>

  <!-- prédio da direita (azul, mais alto) -->
  <rect x="258" y="116" width="102" height="164" rx="6" fill="url(#predio)"/>
  <rect x="276" y="136" width="24" height="24" rx="4" fill="#cffafe"/>
  <rect x="318" y="136" width="24" height="24" rx="4" fill="#cffafe"/>
  <rect x="276" y="176" width="24" height="24" rx="4" fill="#cffafe"/>
  <rect x="318" y="176" width="24" height="24" rx="4" fill="#fcd34d"/>
  <rect x="276" y="216" width="24" height="24" rx="4" fill="#cffafe"/>
  <rect x="300" y="248" width="30" height="32" rx="4" fill="#fcd34d"/>

  <!-- chão -->
  <rect x="40" y="280" width="360" height="12" rx="6" fill="#ffffff" opacity="0.5"/>

  <!-- estudante 1 (âmbar) -->
  <circle cx="186" cy="232" r="14" fill="#fcd34d"/>
  <rect x="173" y="246" width="26" height="34" rx="10" fill="#f59e0b"/>
  <!-- estudante 2 (ciano claro) -->
  <circle cx="221" cy="236" r="12" fill="#67e8f9"/>
  <rect x="210" y="248" width="22" height="32" rx="9" fill="#ffffff"/>

  <!-- livro flutuante -->
  <g transform="rotate(-12 150 95)">
    <rect x="120" y="76" width="60" height="44" rx="5" fill="#ffffff"/>
    <line x1="150" y1="78" x2="150" y2="118" stroke="#06b6d4" stroke-width="3"/>
    <line x1="132" y1="92" x2="144" y2="92" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="156" y1="92" x2="168" y2="92" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="132" y1="102" x2="144" y2="102" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="156" y1="102" x2="168" y2="102" stroke="#1e3a8a" stroke-width="2"/>
  </g>

  <!-- balão de conversa -->
  <g>
    <rect x="236" y="68" width="72" height="48" rx="13" fill="#ffffff"/>
    <path d="M252 116 l-6 16 18 -12 z" fill="#ffffff"/>
    <circle cx="259" cy="92" r="5" fill="#f59e0b"/>
    <circle cx="273" cy="92" r="5" fill="#06b6d4"/>
    <circle cx="287" cy="92" r="5" fill="#1e3a8a"/>
  </g>
</svg>
